name: Release

# Build and publish a GitHub release only when a version tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GraalVM serves as the single JDK: javac/tests, native-image, and a
      # full jpackage with jmods.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools fakeroot

      - name: Build static zlib for musl
        run: |
          scripts/setup-musl.sh
          echo "$PWD/.musl/bin" >> "$GITHUB_PATH"

      - name: Build jars and run tests
        run: ./mvnw -B package

      - name: Build static native binary
        run: |
          ./mvnw -B -Pnative -pl httpjd-cli -am -DskipTests package
          file httpjd-cli/target/httpjd | grep -q 'statically linked'

      - name: Build .deb installer
        run: ./mvnw -B -Pjpackage -pl httpjd-gui -am -DskipTests -Djpackage.type=deb verify

      - name: Stage release assets
        run: |
          mkdir -p release
          cp httpjd-cli/target/httpjd "release/httpjd-${GITHUB_REF_NAME}-linux-amd64"
          cp httpjd-cli/target/httpjd.jar release/
          cp httpjd-gui/target/httpjd-gui.jar release/
          cp httpjd-gui/target/dist/*.deb release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*
